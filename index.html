<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Ryan Hsieh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&display=swap">
<!-- Shell (published as index.html): the pages live in two stacked iframes. The next page loads in the hidden one and is only
     shown once it has loaded, its fonts are ready and its first image is decoded, so a page change never shows a half-built
     page or a blank frame (the flash Ryan saw in all three full-page transitions, 2026-11-12). URL: index.html#/work.html#KlassiC -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#fcfcfc}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:transparent}
iframe.bk{opacity:0;pointer-events:none;z-index:1}
iframe.fr{opacity:1;z-index:2}
.tx{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(20px,4vw,48px);
  background:var(--c);color:var(--k);font-family:Inter,system-ui,sans-serif;pointer-events:none;will-change:clip-path,opacity}
.tx::after{content:"";position:absolute;top:0;bottom:0;left:0;width:clamp(6px,1vw,14px);background:rgba(255,255,255,.18)}
.tx.flat::after{display:none}
.tx b,.tx span{display:block}
.tx b{font:700 clamp(64px,14vw,220px)/.9 Inter,system-ui,sans-serif;letter-spacing:-.04em}
.tx span{margin-top:.3em;font:600 clamp(18px,2.6vw,40px)/1.1 Inter,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.02em;max-width:20ch}
.tx small{font:500 13px Inter,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.tx>*{transition:opacity .25s ease}
.tx.quiet>*{opacity:0}
</style>
</head>
<body>
<iframe class="fr" title="Ryan Hsieh" allow="autoplay; fullscreen; picture-in-picture"></iframe>
<iframe class="bk" title="" aria-hidden="true" tabindex="-1" allow="autoplay; fullscreen; picture-in-picture"></iframe>
<script>
(()=>{
  const PAGES=['home.html','work.html','play.html','about.html'],MK='rh-tx-mode';
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const MODE='A';   // Ryan picked A (obi band sweep), 2026-11-12
  let C={};fetch('assets/obi-colors.json').then(r=>r.json()).then(j=>C=j).catch(()=>{});
  let [fr,bk]=document.querySelectorAll('iframe'),busy=null,cur='';
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const raf2=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  const ink=h=>{const n=parseInt(h.slice(1),16);return (0.2126*(n>>16)+0.7152*(n>>8&255)+0.0722*(n&255))/255>.5?'#111':'#fff';};
  // "work.html#KlassiC" / "index.html#x" / "" → "home.html#x"
  const norm=s=>{s=(s||'').replace(/^\/+/,'');let [f,...h]=s.split('#');f=(f||'').split('/').pop();
    if(!f||f==='index.html')f='home.html';if(!PAGES.includes(f))f='home.html';return f+(h.length?'#'+h.join('#'):'');};
  const fromHash=()=>norm(decodeURIComponent(location.hash.replace(/^#\/?/,'')));
  const setUrl=(t,push)=>{const h='#/'+t;if(location.hash===h)return;try{history[push?'pushState':'replaceState'](null,'',h);}catch(e){}};
  // load t into frame f and wait until it is ready to be seen
  function load(f,t){return new Promise(res=>{
    let done=false;const fin=ok=>{if(!done){done=true;res(ok);}};
    f._ev=0;f.onload=async()=>{try{const d=f.contentDocument;
        await Promise.race([d.fonts?d.fonts.ready:0,sleep(1200)]);
        const im=d.querySelector('#main img, .disc img, img');
        if(im&&im.decode)await Promise.race([im.decode().catch(()=>{}),sleep(600)]);
        await raf2();fin(true);}catch(e){fin(false);}};
    setTimeout(()=>fin(false),6000);nav(f,t);});}
  // location.replace, not src: changing a frame's src adds a history entry and breaks the back button
  // ?v=BUILD on every page load: GitHub Pages lets browsers cache pages for 10 min, so without it a page
  // opened again in the frame could come from cache as an older version (Ryan saw the old record label, 2026-11-13). Bump BUILD on each release.
  const BUILD='71';
  const bust=t=>{if(t==='about:blank')return t;const u=new URL(t,location.href);u.searchParams.set('v',BUILD);return u.href;};
  const nav=(f,t)=>{try{f.contentWindow.location.replace(bust(t));}catch(e){f.src=bust(t);}};
  function swap(t){const o=fr;fr=bk;bk=o;fr.className='fr';bk.className='bk';
    fr.removeAttribute('aria-hidden');fr.removeAttribute('tabindex');fr.title='Ryan Hsieh';
    bk.setAttribute('aria-hidden','true');bk.tabIndex=-1;bk.title='';
    cur=t;try{document.title=fr.contentDocument.title||'Ryan Hsieh';fr.contentWindow.focus();}catch(e){}if(!fr._ev){fr._ev=1;ev(fr);}}
  const ev=f=>{try{f.contentWindow.dispatchEvent(new Event('rh-shown'));}catch(e){}};
  function shown(){setTimeout(()=>{if(!busy)nav(bk,'about:blank');},50);}
  function panel(o,quiet){const d=document.createElement('div');d.className='tx'+(quiet?' quiet':'');d.setAttribute('aria-hidden','true');
    d.style.setProperty('--c',o.c);d.style.setProperty('--k',ink(o.c));
    const s=document.createElement('small');s.textContent=o.label||(o.dir==='back'?'◀◀ Rewind':'▶ Now playing');
    const b=document.createElement('b');b.textContent=o.n||'';const sp=document.createElement('span');sp.textContent=o.title||'';
    const m=document.createElement('div');m.append(b,sp);d.append(s,m);document.body.appendChild(d);return d;}
  const anim=(el,k,ms,ease)=>el.animate(k,{duration:ms,easing:ease,fill:'forwards'}).finished;
  const CL={L0:'inset(0 100% 0 0)',R0:'inset(0 0 0 100%)',full:'inset(0 0 0 0)'};

  async function go(target,o,push){
    const t=norm(target);o=o||{};
    if(t===cur)return;
    if(busy)return;           // one change at a time
    busy=true;
    o.c=o.c||(C[o.slug]&&C[o.slug].bg)||(t.startsWith('home')?'#2a2ecd':'#111111');
    if(push!==false)setUrl(t,true);
    try{
      if(reduce||!cur){if(await load(bk,t)!==false){swap(t);shown();}}
      else if(MODE==='A'){
        const d=panel(o);d.style.clipPath=o.dir==='back'?CL.R0:CL.L0;
        const sweep=anim(d,[{clipPath:d.style.clipPath},{clipPath:CL.full}],340,'cubic-bezier(.7,0,.9,.6)');
        const [ok]=await Promise.all([load(bk,t),sweep.then(()=>sleep(220))]);
        swap(t);d.classList.add('quiet');await raf2();
        await anim(d,[{clipPath:CL.full},{clipPath:o.dir==='back'?CL.L0:CL.R0}],460,'cubic-bezier(.3,0,.1,1)');d.remove();shown();
      }else if(MODE==='B'){
        const d=panel(o,true);d.classList.add('flat');d.style.opacity=0;
        await Promise.all([load(bk,t),anim(d,[{opacity:0},{opacity:1}],200,'ease-in')]);
        swap(t);await raf2();
        await anim(d,[{opacity:1},{opacity:0}],320,'ease-out');d.remove();shown();
      }else{ // C: the new page is fully built underneath, then cross-fades in over the old one
        await load(bk,t);
        const old=fr,nu=bk;nu._ev=1;ev(nu);nu.style.zIndex=3;nu.style.opacity=0;nu.style.pointerEvents='auto';
        const dy=o.dir==='back'?-14:14;
        // the old page stays fully opaque underneath, so nothing pale ever shows between the two
        await anim(nu,[{opacity:0,transform:`translateY(${dy}px)`},{opacity:1,transform:'none'}],420,'cubic-bezier(.2,.7,.2,1)');
        swap(t);nu.getAnimations().forEach(a=>a.cancel());old.getAnimations().forEach(a=>a.cancel());
        nu.style.cssText='';old.style.cssText='';shown();
      }
    }finally{busy=false;}
    // a back/forward press that came in while we were busy
    if(fromHash()!==cur)go(fromHash(),{dir:'back'},false);
  }
  // keep the address in step when a page changes its own hash (work.html prev / next)
  function sync(){try{const L=fr.contentWindow.location,f=L.pathname.split('/').pop();cur=norm(f+L.hash);setUrl(cur,false);document.title=fr.contentDocument.title;}catch(e){}}
  addEventListener('popstate',()=>{const t=fromHash();if(t===cur)return;
    // same page, other hash: let the page handle it
    if(t.split('#')[0]===cur.split('#')[0]){try{fr.contentWindow.location.hash=t.split('#')[1]||'';cur=t;return;}catch(e){}}
    go(t,{dir:'back'},false);});
  window.RH_SHELL={go:(u,o)=>go(u,o,true),sync,get mode(){return MODE;}};

  // first page: if the frame cannot load (a host that blocks frames), fall back to plain pages
  (async()=>{const t=fromHash();setUrl(t,false);
    const ok=await load(fr,t);
    if(!ok){try{sessionStorage.setItem('rh-noshell','1');}catch(e){}location.replace(t);return;}
    cur=t;try{document.title=fr.contentDocument.title;fr.contentWindow.focus();}catch(e){}ev(fr);})();

})();
</script>
</body>
</html>
